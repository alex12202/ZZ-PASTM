name: PWA na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zz-denik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zz-denik/package-lock.json
      - run: npm ci
      # Pribalený katalóg (backend/data/catalog.json) nie je v gite —
      # vygeneruje sa z import_files rovnako ako pri lokálnom builde.
      - run: npm run catalog:import
      - run: npm run build
        env:
          VITE_STATIC_CATALOG: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zz-denik/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
